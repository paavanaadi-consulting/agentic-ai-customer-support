{{- if .Values.mcpPostgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-ai-customer-support.fullname" . }}-mcp-postgres
  labels:
    {{- include "agentic-ai-customer-support.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-postgres
spec:
  replicas: {{ .Values.mcpPostgres.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentic-ai-customer-support.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-postgres
  template:
    metadata:
      labels:
        {{- include "agentic-ai-customer-support.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-postgres
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      containers:
      - name: mcp-postgres
        image: "{{ .Values.global.imageRegistry }}{{ .Values.mcpPostgres.image.repository }}:{{ .Values.mcpPostgres.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.mcpPostgres.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        env:
        {{- include "agentic-ai-customer-support.commonEnv" . | nindent 8 }}
        - name: MCP_SERVER_PORT
          value: "8001"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.mcpPostgres.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
