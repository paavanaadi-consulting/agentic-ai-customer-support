apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic-ai-customer-support.fullname" . }}-config
  labels:
    {{- include "agentic-ai-customer-support.labels" . | nindent 4 }}
data:
  # Database configuration
  DATABASE_HOST: {{ if .Values.postgresql.enabled }}{{ include "agentic-ai-customer-support.fullname" . }}-postgresql{{ else }}{{ .Values.externalDatabase.host }}{{ end }}
  DATABASE_PORT: {{ if .Values.postgresql.enabled }}"5432"{{ else }}{{ .Values.externalDatabase.port | quote }}{{ end }}
  DATABASE_NAME: {{ if .Values.postgresql.enabled }}{{ .Values.postgresql.auth.database }}{{ else }}{{ .Values.externalDatabase.database }}{{ end }}
  DATABASE_USER: {{ if .Values.postgresql.enabled }}{{ .Values.postgresql.auth.username }}{{ else }}{{ .Values.externalDatabase.username }}{{ end }}
  
  # Kafka configuration
  KAFKA_BOOTSTRAP_SERVERS: {{ include "agentic-ai-customer-support.kafkaBootstrapServers" . }}
  
  # Qdrant configuration
  QDRANT_URL: {{ include "agentic-ai-customer-support.qdrantUrl" . }}
  
  # Application configuration
  LOG_LEVEL: {{ .Values.api.env.LOG_LEVEL }}
  APP_NAME: {{ .Values.app.name }}
  APP_VERSION: {{ .Values.app.version }}
  
  # MCP Service URLs
  MCP_POSTGRES_URL: {{ if .Values.mcpPostgres.enabled }}http://{{ include "agentic-ai-customer-support.fullname" . }}-mcp-postgres:{{ .Values.mcpPostgres.service.port }}{{ else }}""{{ end }}
  MCP_KAFKA_URL: {{ if .Values.mcpKafka.enabled }}http://{{ include "agentic-ai-customer-support.fullname" . }}-mcp-kafka:{{ .Values.mcpKafka.service.port }}{{ else }}""{{ end }}
