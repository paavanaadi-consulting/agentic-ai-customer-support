{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-ai-customer-support.fullname" . }}-qdrant
  labels:
    {{- include "agentic-ai-customer-support.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  type: {{ .Values.qdrant.service.type }}
  ports:
  - port: {{ .Values.qdrant.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: 6334
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "agentic-ai-customer-support.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
{{- end }}
