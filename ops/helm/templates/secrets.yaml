apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-ai-customer-support.fullname" . }}-secrets
  labels:
    {{- include "agentic-ai-customer-support.labels" . | nindent 4 }}
type: Opaque
data:
  # Database password
  {{- if .Values.postgresql.enabled }}
  DATABASE_PASSWORD: {{ .Values.postgresql.auth.password | b64enc }}
  {{- else }}
  DATABASE_PASSWORD: {{ .Values.externalDatabase.password | b64enc }}
  {{- end }}
  
  # AI API Keys (these should be provided via external secrets in production)
  {{- if .Values.secrets.claudeApiKey }}
  CLAUDE_API_KEY: {{ .Values.secrets.claudeApiKey | b64enc }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc }}
  {{- end }}
  {{- if .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | b64enc }}
  {{- end }}
  
  # JWT Secret
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
