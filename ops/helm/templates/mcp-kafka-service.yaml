{{- if .Values.mcpKafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-ai-customer-support.fullname" . }}-mcp-kafka
  labels:
    {{- include "agentic-ai-customer-support.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-kafka
spec:
  type: {{ .Values.mcpKafka.service.type }}
  ports:
  - port: {{ .Values.mcpKafka.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "agentic-ai-customer-support.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-kafka
{{- end }}
