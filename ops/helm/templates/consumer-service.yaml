{{- if .Values.consumer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-ai-customer-support.fullname" . }}-consumer
  labels:
    {{- include "agentic-ai-customer-support.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer
spec:
  type: {{ .Values.consumer.service.type }}
  ports:
  - port: {{ .Values.consumer.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "agentic-ai-customer-support.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: consumer
{{- end }}
