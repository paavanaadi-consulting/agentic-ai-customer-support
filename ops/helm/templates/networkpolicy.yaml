{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic-ai-customer-support.fullname" . }}
  labels:
    {{- include "agentic-ai-customer-support.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic-ai-customer-support.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow communication between components
  - from:
    - podSelector:
        matchLabels:
          {{- include "agentic-ai-customer-support.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8003
    - protocol: TCP
      port: 6333
  egress:
  # Allow egress to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to Kafka
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Allow egress to Qdrant
  - to:
    - podSelector:
        matchLabels:
          {{- include "agentic-ai-customer-support.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: qdrant
    ports:
    - protocol: TCP
      port: 6333
  # Allow egress to external APIs (AI services)
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
{{- end }}
