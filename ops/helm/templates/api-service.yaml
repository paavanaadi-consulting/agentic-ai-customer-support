apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-ai-customer-support.fullname" . }}-api
  labels:
    {{- include "agentic-ai-customer-support.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- if .Values.api.service.annotations }}
  annotations:
    {{- toYaml .Values.api.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
  - port: {{ .Values.api.service.port }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
    nodePort: {{ .Values.api.service.nodePort }}
    {{- end }}
  selector:
    {{- include "agentic-ai-customer-support.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
