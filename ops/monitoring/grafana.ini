[server]
http_port = 3000
domain = localhost

[security]
admin_user = admin
admin_password = admin123
allow_sign_up = false

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[auth]
disable_login_form = false

[log]
mode = console
level = info

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[analytics]
reporting_enabled = false

[check_for_updates]
enabled = false

[unified_alerting]
enabled = true
